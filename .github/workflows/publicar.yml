# Pruebas del kit en cada cambio y publicación de la release al subir una etiqueta vX.Y.Z.
# La release es la que usa el instalador de una línea:
#   https://github.com/uxlelmar-eaac/uxyngraphar-kit/releases/latest/download/instalar-uxyngraphar.py
name: publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  pruebas:
    name: pruebas (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: español
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Catálogo de paquetes válido
        run: python motor/uxyngraphar.py validar
      - name: Pruebas del kit (motor, paquetes, migración, instalador)
        run: python -m unittest discover -s motor/pruebas -t motor/pruebas

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: español
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generar los archivos de la release
        run: python3 motor/distribucion/publicar.py --salida dist --etiqueta "$GITHUB_REF_NAME"
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/uxyngraphar-${version}.zip" \
            dist/instalar-uxyngraphar.py \
            dist/SHA256SUMS \
            --title "uxyngraphar ${version}" \
            --notes "Instalar en una línea: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/instalar-uxyngraphar.py (ver README). Cambios: español/motor/CHANGELOG.md." \
            --verify-tag
