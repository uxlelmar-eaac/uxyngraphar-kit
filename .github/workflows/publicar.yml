# Publica la release al subir una etiqueta vX.Y.Z, solo si la matriz de pruebas (pruebas.yml) pasa en ese commit.
# La release es la que usa el instalador de una línea:
#   https://github.com/uxlelmar-eaac/uxyngraphar-kit/releases/latest/download/instalar-uxyngraphar.py
# Cada archivo publicado lleva una atestación de procedencia (actions/attest-build-provenance): el instalador la comprueba
# con «gh attestation verify» cuando gh está disponible (ver SECURITY.md).
name: publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write       # atestaciones de procedencia (firma sin clave con el OIDC de GitHub)
      attestations: write
    defaults:
      run:
        working-directory: español
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Generar los archivos de la release
        run: python3 motor/distribucion/publicar.py --salida dist --etiqueta "$GITHUB_REF_NAME"
      - name: Atestación de procedencia del zip, el instalador y SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            español/dist/uxyngraphar-*.zip
            español/dist/instalar-uxyngraphar.py
            español/dist/SHA256SUMS
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/uxyngraphar-${version}.zip" \
            dist/instalar-uxyngraphar.py \
            dist/SHA256SUMS \
            --title "uxyngraphar ${version}" \
            --notes "Instalar en una línea: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/instalar-uxyngraphar.py (ver README). Cambios: español/motor/CHANGELOG.md." \
            --verify-tag \
            --latest
      - name: Comprobar la release publicada (si falla, vuelve a borrador y nadie la instala)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          casa="$RUNNER_TEMP/uxy-comprobacion"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/instalar-uxyngraphar.py"
          if curl -fsSL --retry 5 --retry-delay 5 "$url" \
               | UXYNGRAPHAR_HOME="$casa" UXYNGRAPHAR_CONSOLA=1 UXYNGRAPHAR_SIN_ACCESOS=1 UXYNGRAPHAR_SIN_PATH=1 python3 - --version "$version" \
             && "$casa/bin/uxyngraphar" version | grep -q "uxyngraphar ${version}"; then
            echo "La release ${version} se instala y arranca."
          else
            gh release edit "$GITHUB_REF_NAME" --draft=true
            echo "::error::La release ${version} no se instala bien: vuelve a borrador y la anterior sigue siendo la última."
            exit 1
          fi
