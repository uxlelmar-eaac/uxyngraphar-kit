# Pruebas del kit en cada push a main y en cada PR; publicar.yml las reutiliza antes de publicar una release.
# Las Actions van fijadas por SHA completo (el comentario dice la versión); Dependabot propone las nuevas.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  pruebas:
    name: pruebas (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
        working-directory: español
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Catálogo de sistemas válido
        run: python motor/uxyngraphar.py validar
      - name: Pruebas del kit (motor, sistemas, migración, instalador); un ResourceWarning hace fallar
        run: python -W error::ResourceWarning -m unittest discover -s motor/pruebas -t motor/pruebas

  calidad:
    name: lint y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Herramientas (solo en CI; el kit no tiene dependencias)
        run: python -m pip install --disable-pip-version-check "ruff==0.17.4" "mypy==2.4.1"
      - name: ruff
        run: ruff check español/motor español/sistemas-de-gobernanza/_base
      - name: mypy (módulos incorporados; la lista crece de forma gradual)
        working-directory: español/motor
        run: >-
          mypy --config-file ../../pyproject.toml
          transaccion.py repo.py panel.py rutas_panel.py procesos.py casa.py vocabulario.py
          distribucion/publicar.py distribucion/arranque_descarga.py

  cobertura:
    name: cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: español
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "coverage==7.17.2"
      - name: Pruebas con cobertura
        run: coverage run --rcfile=../pyproject.toml -m unittest discover -s motor/pruebas -t motor/pruebas
      - name: Informe y suelo (motor/pruebas/cobertura.py)
        run: |
          coverage report --rcfile=../pyproject.toml > cobertura.txt || true
          coverage html --rcfile=../pyproject.toml -d cobertura-html
          cat cobertura.txt
          python motor/pruebas/cobertura.py cobertura.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura
          path: |
            español/cobertura.txt
            español/cobertura-html
