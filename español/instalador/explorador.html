<!-- Explorador de carpetas común. El servidor lo inserta en cada página en el marcador EXPLORADOR. Uso: elegirCarpeta(rutaInicial) → Promise<ruta|null>. -->
<style>
dialog.exp{width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
dialog.exp::backdrop{background:rgba(0,0,0,.45)}
dialog.exp form{display:flex;flex-direction:column;max-height:calc(100vh - 34px);padding:16px;gap:10px}
dialog.exp h2{margin:0}.exp-migas{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:.92rem}
.exp-migas button,.exp-atajos button{padding:2px 8px;border-radius:6px}.exp-migas button{border-color:transparent;background:none;color:var(--ac)}
.exp-migas span{color:var(--mut)}.exp-atajos{display:flex;flex-wrap:wrap;gap:6px}.exp-atajos button{font-size:.88rem;border-radius:999px}
.exp-lista{list-style:none;margin:0;padding:0;overflow:auto;min-height:120px;flex:1;border:1px solid var(--bd);border-radius:8px}
.exp-lista li{border-bottom:1px solid var(--bd)}.exp-lista li:last-child{border:0}
.exp-lista button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:8px 12px}
.exp-lista button:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}.exp-lista .nom{flex:1;overflow-wrap:anywhere}
.exp-et{font-size:.75rem;border-radius:999px;padding:1px 8px;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}.exp-et.ux{background:var(--okb);color:var(--ok);border-color:transparent}
.exp-pie{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}.exp-pie div{display:flex;gap:8px;margin-left:auto}
.exp-vacio{padding:12px;color:var(--mut)}
</style>
<dialog class="exp" id="exp" aria-labelledby="exp-t">
<form method="dialog" onsubmit="return false">
<h2 id="exp-t">Elige una carpeta</h2>
<nav class="exp-migas" id="exp-migas" aria-label="Ruta actual"></nav>
<div class="fila"><input type="text" id="exp-ruta" aria-label="Ruta de la carpeta" spellcheck="false" autocomplete="off"><button type="button" id="exp-ir">Ir</button></div>
<div class="exp-atajos" id="exp-atajos" aria-label="Atajos"></div>
<div id="exp-msg" role="status"></div>
<ul class="exp-lista" id="exp-lista" aria-label="Subcarpetas"></ul>
<div class="exp-pie"><button type="button" id="exp-subir">↑ Subir</button><label><input type="checkbox" id="exp-ocultas"> Mostrar carpetas ocultas</label>
<div><button type="button" id="exp-no">Cancelar</button><button type="button" class="pri" id="exp-si">Usar esta carpeta</button></div></div>
</form>
</dialog>
<script>
(()=>{
 const d=document.getElementById("exp"),g=id=>document.getElementById("exp-"+id);
 const e=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 let actual=null,padre=null,fin=null,volver=null;
 async function cargar(ruta){
  g("msg").innerHTML="";
  let r;try{r=await(await fetch("/api/carpetas",{method:"POST",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify({ruta,ocultas:g("ocultas").checked})})).json()}
  catch(_){r={ok:false,error:"No pude hablar con el asistente. ¿Sigue abierto en la terminal?"}}
  if(!r.ok){g("msg").innerHTML=`<div class="aviso er">${e(r.error||"No pude abrir esa carpeta.")}</div>`;if(actual===null)g("ruta").value=ruta||"";return}
  actual=r.ruta;padre=r.padre;g("ruta").value=r.ruta;g("subir").disabled=!r.padre;
  const sep=r.ruta.includes("\\")?"\\":"/",partes=r.ruta.split(/[\\/]/);let acc="",m=[];
  partes.forEach((p,i)=>{if(i===0){acc=p+sep;m.push([p||sep,acc])}else if(p){acc+=(acc.endsWith(sep)?"":sep)+p;m.push([p,acc])}});
  g("migas").innerHTML=m.map(([n,ru],i)=>`${i?"<span>›</span>":""}<button type="button" data-r="${e(ru)}"${i===m.length-1?' aria-current="location"':""}>${e(n)}</button>`).join("");
  g("atajos").innerHTML=(r.atajos||[]).map(a=>`<button type="button" data-r="${e(a.ruta)}" title="${e(a.ruta)}">${a.proyecto?"★ ":""}${e(a.nombre)}</button>`).join("");
  g("lista").innerHTML=r.carpetas.length?r.carpetas.map(c=>`<li><button type="button" data-r="${e(c.ruta)}"><span aria-hidden="true">📁</span><span class="nom">${e(c.nombre)}</span>${c.git?'<span class="exp-et">git</span>':""}${c.uxyngraphar?'<span class="exp-et ux">uxyngraphar</span>':""}</button></li>`).join(""):`<li class="exp-vacio">Sin subcarpetas.</li>`;
  if(r.truncada)g("msg").innerHTML=`<div class="aviso av">Hay muchas carpetas: muestro las primeras ${r.carpetas.length}. Escribe la ruta en el cuadro para ir directo.</div>`;
  g("lista").scrollTop=0}
 function cerrar(v){const f=fin;fin=null;if(d.open)d.close();if(volver)volver.focus();if(f)f(v)}
 d.addEventListener("click",ev=>{const b=ev.target.closest("button[data-r]");if(b)cargar(b.dataset.r)});
 d.addEventListener("cancel",ev=>{ev.preventDefault();cerrar(null)});
 g("ir").onclick=()=>cargar(g("ruta").value);g("ruta").onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();cargar(g("ruta").value)}};
 g("subir").onclick=()=>padre&&cargar(padre);g("ocultas").onchange=()=>cargar(actual||"");
 g("no").onclick=()=>cerrar(null);g("si").onclick=()=>cerrar(actual);
 window.elegirCarpeta=(inicial)=>new Promise(res=>{fin=res;volver=document.activeElement;actual=null;d.showModal();g("ruta").focus();cargar((inicial||"").trim()).then(()=>{if(actual===null&&inicial)cargar("")})});
})();
</script>
