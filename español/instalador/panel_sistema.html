<script>
// Pestaña «Sistema» del panel (se inserta en pagina_panel.html): la herramienta de este equipo. Versión y actualización,
// versiones guardadas, el comando en la terminal (PATH), limpieza del registro y desinstalar.
async function cargarSistema(){S.sis=await post("/api/sistema/info");if(S.tab==="sistema")dibujar()}
function vSistema(){const r=S.res,s=S.sis;if(!r||!s){$("#vista").innerHTML=`<div class="card">Cargando…</div>`;if(!s)cargarSistema();return}
 const otras=s.guardadas.filter(v=>v!==s.activa);
 $("#vista").innerHTML=aviso()+`<div class="card"><h2>Versión de uxyngraphar</h2><p>Herramienta <b>${esc(r.version)}</b> · carpeta <code>${esc(s.carpeta)}</code></p>
 <p>${estadoVersion(true)}</p>${S.actMsg||""}
 ${s.activa&&s.activa!==r.version?`<div class="aviso av">La versión activa es la ${esc(s.activa)}, pero este panel es de la ${esc(r.version)}. <button class="pri" onclick="reiniciarPanel()">Abrir el panel de la ${esc(s.activa)}</button></div>`:""}</div>
 <div class="card"><h2>Versiones guardadas</h2><p class="mut">Se guardan las últimas en este equipo para poder volver atrás sin conexión. Cambiar de versión no toca tus proyectos.</p>
 ${s.guardadas.length?`<table><tbody>${s.guardadas.map(v=>`<tr><td><b>${esc(v)}</b>${v===s.activa?` <span class="et ok">activa</span>`:""}</td><td>${v===s.activa?"":`<button onclick="usarVersion('${esc(v)}')">Usar esta</button>`}</td></tr>`).join("")}</tbody></table>`:`<p class="mut">${s.instalada?"No hay otras versiones guardadas.":"Este panel corre desde una copia del repositorio: no hay versiones instaladas."}</p>`}
 <div class="fila" style="margin-top:8px"><input type="text" id="otraver" placeholder="Otra versión, p. ej. ${esc(otras[0]||"1.1.0")}" aria-label="Versión"><button onclick="usarVersion($('#otraver').value)">Descargar y usar</button></div>${S.usarMsg||""}</div>
 <div class="card"><h2>El comando <code>uxyngraphar</code> en tu terminal</h2>
 <p>Para abrir este panel solo necesitas escribir <code>uxyngraphar</code> en una terminal. ${s.en_path?`<span class="et ok">Ya está en tu PATH</span>`:`<span class="et av">Aún no está en tu PATH</span>`}</p>
 <p class="mut">Su carpeta es <code>${esc(s.bin)}</code>. ${s.windows?"Se añade a tu PATH de usuario.":"Se añade un bloque marcado a tu archivo de inicio de la terminal"+(s.perfil?` (<code>${esc(s.perfil)}</code>)`:"")+"."} Después abre una terminal nueva.</p>
 ${s.home_propio&&!s.en_path?`<p class="mut">Usas una carpeta propia (<code>UXYNGRAPHAR_HOME</code>): el panel no toca tu PATH. Añade esa carpeta tú si lo quieres.</p>`:""}
 <div class="fila">${s.en_path||s.home_propio?"":`<button class="pri" onclick="cambiarPath(true)">Añadir al PATH</button>`}${s.path_nuestro?`<button onclick="cambiarPath(false)">Quitarlo del PATH</button>`:""}</div>${S.pathMsg||""}</div>
 <div class="card"><h2>Limpiar</h2><p class="mut">Quita de «Mis proyectos» los que ya no existen (o ya no tienen uxyngraphar) y el aviso de una instalación que se cortó. No borra ninguna carpeta.</p>
 ${s.rotos.length||s.candado.abandonado?`<ul class="pl">${s.rotos.map(x=>`<li><code>${esc(x.ruta)}</code> — ${esc(x.motivo)}</li>`).join("")}${s.candado.abandonado?`<li>Instalación cortada hace ${s.candado.minutos} min (<code>${esc(s.candado.ruta)}</code>)</li>`:""}</ul><button class="pri" onclick="limpiarSistema()">Limpiar</button>`:`<div class="aviso ok">No hay nada que limpiar.</div>`}
 ${s.candado.existe&&!s.candado.abandonado?`<div class="aviso av">Hay una instalación en curso (desde hace ${s.candado.minutos} min). Espera a que termine.</div>`:""}${S.limpMsg||""}</div>
 <div class="card"><details><summary><b>Desinstalar uxyngraphar de este equipo</b></summary>
 <p>Borra <code>${esc(s.carpeta)}</code>, el comando <code>uxyngraphar</code> y la línea del PATH que añadió. <b>Tus proyectos no se tocan</b>: cada uno conserva su carpeta <code>uxyngraphar/</code> y sigue funcionando.</p>
 <p class="mut">Al terminar, este panel se cierra solo (su propio programa ya no existe). La terminal donde lo abriste puede mostrar un aviso${s.windows?" (en Windows, «no se encuentra el archivo por lotes»)":""}: es normal. Para volver a instalarlo, usa el comando de instalación de una línea.</p>
 <div class="fila"><input type="text" id="confdes" placeholder="Escribe: desinstalar" aria-label="Confirmación"><button onclick="desinstalarTodo()">Desinstalar</button></div>${S.desMsg||""}</details></div>`}
async function usarVersion(v){v=(v||"").trim();if(!v)return;if(!confirm(`¿Usar uxyngraphar ${v}? Tus proyectos no cambian.`))return;
 S.usarMsg=`<div class="aviso">Cambiando a la ${esc(v)}… (si hay que descargarla, puede tardar un minuto)</div>`;dibujar();const r=await post("/api/sistema/usar",{version:v});
 if(!r.ok){S.usarMsg=msg(false,esc(r.error)+(r.salida?`<details><summary>Detalle</summary>${pre(r.salida)}</details>`:""));dibujar();return}
 if(r.reiniciable)return reiniciarPanel();
 S.usarMsg=msg(true,`Versión activa: ${esc(r.version)}. Esta versión no puede abrir el panel por sí sola desde aquí: cierra este panel y vuelve a abrirlo con <code>uxyngraphar</code>.`);await cargarSistema();dibujar()}
async function cambiarPath(agregar){const r=await post("/api/sistema/path",{agregar});S.pathMsg=msg(r.ok,esc(r.texto||r.error));await cargarSistema();dibujar()}
async function limpiarSistema(){const r=await post("/api/sistema/limpiar",{aplicar:true});S.limpMsg=r.ok?msg(true,`Listo: ${r.quitados.length} proyecto(s) quitados del registro${r.candado_quitado?" y el aviso de instalación cortada":""}.`):msg(false,esc(r.error));await cargar();await cargarSistema()}
async function desinstalarTodo(){const c=$("#confdes").value;if(c.trim().toLowerCase()!=="desinstalar"){S.desMsg=msg(false,"Escribe «desinstalar» para confirmar.");dibujar();return}
 if(!confirm("Última confirmación: ¿desinstalar uxyngraphar de este equipo?"))return;const r=await post("/api/sistema/desinstalar",{confirmacion:c});
 if(!r.ok){S.desMsg=msg(false,esc(r.error));dibujar();return}
 document.querySelector("main").innerHTML=`<div class="card"><h2>uxyngraphar se desinstaló</h2><ul class="pl">${r.hecho.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p>Tus proyectos no se tocaron. Este panel ya está cerrado: puedes cerrar la pestaña.</p></div>`}
// Tras actualizar o cambiar de versión: el panel nuevo arranca en segundo plano y esta página se va a él.
async function reiniciarPanel(){document.querySelector("main").insertAdjacentHTML("afterbegin",`<div class="aviso av" id="reinicio">Abriendo el panel de la versión nueva…</div>`);
 const r=await post("/api/sistema/reiniciar");if(r.ok){location.href=r.url;return}
 const e=$("#reinicio");if(e)e.remove();S.actMsg=msg(false,esc(r.error));dibujarVer();dibujar()}
</script>
