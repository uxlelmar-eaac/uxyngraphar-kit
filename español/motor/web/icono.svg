<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="uxyngraphar">
  <!-- Marca plana de uxyngraphar: monograma cuadrado + brújula.
       Oro = la IA ejecuta · naranja = la persona decide · verde = el código lo comprueba.
       Solo usa primitivos de la paleta «Tres señales» (ink, brand-alt, brand, affirm, tone). -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#121002" stroke="#a6a07e" stroke-opacity=".35" stroke-width="1.5"/>
  <!-- Marco del monograma (U/R/X/A estilizado) -->
  <path d="M18 18h12v8H26v12h-8V18zm16 0h12v20h-8V26h-4V18z" fill="none" stroke="#00a870" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 38h8v8h4v-8h8v12H18V38zm28 0v12H34v-8h4v-4h8z" fill="none" stroke="#e84800" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brújula / estrella de cuatro puntas -->
  <path d="M32 22 L34.2 29.8 L42 32 L34.2 34.2 L32 42 L29.8 34.2 L22 32 L29.8 29.8 Z" fill="#b8a018"/>
  <circle cx="32" cy="32" r="2.2" fill="#121002"/>
  <path d="M30.6 32h2.8M32 30.6v2.8" stroke="#b8a018" stroke-width="1" stroke-linecap="round"/>
</svg>
