<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="uxyngraphar" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Logo de uxyngraphar: una «u» de tres trazos, uno por cada papel del lema.
       Azul = la IA ejecuta · verde = el código lo comprueba · naranja (la base que los une) = la persona decide.
       Solo usa primitivos de la paleta «Tres señales» (ink, brand-alt, brand, affirm, tone). -->
