  <path d="M21 16v16" fill="none" stroke="#3d5afe" stroke-width="8" stroke-linecap="round"/>
  <path d="M43 16v16" fill="none" stroke="#19d27a" stroke-width="8" stroke-linecap="round"/>
  <path d="M21 32a11 11 0 0 0 22 0" fill="none" stroke="#ff6b1a" stroke-width="8" stroke-linecap="round"/>
